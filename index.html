<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="찹찹">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FDF8F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<title>찹찹 ChopChop</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
// 감싸는 쪽이 자기 <head>를 만들면 우리 viewport가 통째로 무시된다.
// 그러면 폭이 980px로 잡혀 글자가 잘게 보인다. 실행 시점에 다시 박아 둔다.
(function(){try{
 var m=document.querySelector('meta[name=viewport]');
 if(!m){m=document.createElement('meta');m.setAttribute('name','viewport');
  (document.head||document.documentElement).appendChild(m);}
 m.setAttribute('content','width=device-width, initial-scale=1, viewport-fit=cover');
}catch(e){}})();
</script>
<style>
/* =========================================================
   찹찹 디자인 시스템
   원칙 1. 시각 정체성(색·플랫·마스코트)은 v24 그대로 둔다.
   원칙 2. 여백·모서리·글자는 토큰으로만 쓴다. 임의값 금지.
   원칙 3. 같은 역할은 같은 모양. 뒤로가기가 화면마다 다르면 그게 버그다.
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word;}
:root{
/* ── 색 (v24 유지) ───────────────────────────── */
--bg:#FDF8F0;--card:#fff;--t1:#1E1B18;--t2:#5C564E;--t3:#6F6053;--t4:#7E6E5A;
--line:rgba(30,27,24,.10);--line2:rgba(30,27,24,.055);
--fill:rgba(30,27,24,.05);--fill2:rgba(30,27,24,.08);
--green:#2DD881;--greenD:#0B7A50;--greenL:#E0FFEE;--onGreen:#1E1B18;--segOff:rgba(30,27,24,.09);
/* 인라인 하드코딩이던 파스텔들 — 다크모드가 못 따라오던 원인이라 토큰으로 끌어냈다 */
--gold-bg:#FFF8E0;--gold-ink:#8F6C10;--gold-dot:#D9A400;
--warm-bg:#FFF3E0;--warm-ink:#A65A02;
--lilac-bg:#F0ECFF;--lilac-ink:#6B4FD8;--lilac-dot:#8B6AFF;
--avt-bg:#FFE8C8;--pop:#FFD23F;
--danger-bg:#FFE0DC;--danger-ink:#B3311F;
/* ── 여백 · 4px 그리드 ───────────────────────── */
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;
--gut:20px;   /* 화면 좌우 여백 — 모든 화면 동일 */
--top:calc(env(safe-area-inset-top, 0px) + 20px);   /* 콘텐츠 시작선 — 모든 화면 동일 */
--btab-h:calc(env(safe-area-inset-bottom, 0px) + 64px);   /* 하단 탭 높이 */
/* ── 모서리 · 동심원(바깥 = 안쪽 + 여백) ─────── */
--r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:28px;--r-full:999px;--r:20px;
/* ── 글자 · 8단계 ────────────────────────────── */
--f-xs:11px;--f-sm:12px;--f-md:13px;--f-base:15px;--f-lg:17px;--f-xl:20px;--f-2xl:24px;--f-3xl:30px;
--font:'Pretendard Variable','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
--ease:cubic-bezier(.2,.7,.3,1);--pop-ease:cubic-bezier(.34,1.56,.64,1);
--mascot-img:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M20 4 Q22 10 28 8 Q26 14 32 14 Q28 18 30 24 Q24 20 20 26 Q16 20 10 24 Q12 18 8 14 Q14 14 12 8 Q18 10 20 4Z' fill='%23FFD23F' stroke='%232E2A24' stroke-width='1.2' stroke-linejoin='round'/><path d='M17 16 Q18 17.5 19 16M21 16 Q22 17.5 23 16' fill='none' stroke='%232E2A24' stroke-width='1' stroke-linecap='round'/><path d='M18 19.5 Q20 22 22 19.5' fill='none' stroke='%232E2A24' stroke-width='1' stroke-linecap='round'/></svg>");
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:var(--font);background:var(--bg);display:flex;justify-content:center;overflow-x:hidden;
 min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums;}
.ph{width:100%;max-width:600px;height:100vh;height:100dvh;background:var(--bg);position:relative;overflow:hidden;}

/* ===== 공통 · 화면 상단 내비 =====
   좌 ‹ = 한 단계 뒤로 / 우 × = 이 흐름 버리고 닫기.
   화면마다 다른 모양이던 것(텍스트 ← 뒤로 / ← 마이 / 알약 ← 돌아가기 / 우상단 X)을 하나로 모았다. */
.navbtn{width:40px;height:40px;border-radius:var(--r-full);background:var(--card);border:1.5px solid var(--line);
 display:grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0;position:relative;
 transition:background-color .15s var(--ease),transform .15s var(--ease);}
.navbtn::after{content:'';position:absolute;inset:-4px;}  /* 48px 터치 타깃 */
.navbtn:active{transform:scale(.96);background:var(--fill);}
.navbtn svg{width:18px;height:18px;stroke:var(--t2);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.navbtn.x svg{width:16px;height:16px;stroke-width:2.2;}
.navbtn.flow{position:absolute;top:var(--top);z-index:3;}
.navbtn.flow.l{left:var(--gut);} .navbtn.flow.r{right:var(--gut);}
/* 화면 제목 블록 — 오버레이 화면 전부 같은 리듬 */
.scr-h{margin:0 0 var(--s5);}
.scr-t{font-size:var(--f-2xl);font-weight:900;color:var(--t1);letter-spacing:-.014em;line-height:1.32;text-wrap:balance;}
.scr-s{font-size:var(--f-md);color:var(--t3);margin-top:var(--s1);font-weight:500;line-height:1.5;}

.full{position:absolute;inset:0;background:var(--bg);z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s8) var(--s7);opacity:0;pointer-events:none;transition:opacity .4s;}
.full.on{opacity:1;pointer-events:auto;}
.full-title{font-size:var(--f-2xl);font-weight:900;color:var(--t1);text-align:center;letter-spacing:-.014em;line-height:1.36;margin:var(--s5) 0 var(--s2);text-wrap:balance;}
.mascot-lg{width:92px;height:92px;background:var(--mascot-img) center/contain no-repeat;}
.done-pts{font-size:64px;font-weight:900;color:var(--greenD);letter-spacing:-.03em;line-height:1;margin-top:var(--s4);font-variant-numeric:tabular-nums;}
.done-task{font-size:var(--f-md);color:var(--t3);text-align:center;margin-top:var(--s1);padding:0 var(--s6);}
.full-sub{font-size:var(--f-md);color:var(--t3);text-align:center;line-height:1.55;margin-bottom:var(--s7);}
/* 주 버튼은 전부 알약. 카드 안에 들어가도 동심원이 어긋나지 않는다 */
.fbtn{min-height:56px;padding:0 var(--s8);border-radius:var(--r-full);background:var(--green);color:var(--onGreen);font-size:var(--f-lg);font-weight:900;border:none;font-family:var(--font);cursor:pointer;transition:transform .15s var(--ease);}
.fbtn:active{transform:scale(.96);}
.fbtn2{min-height:44px;padding:0 var(--s4);background:none;color:var(--t3);font-size:var(--f-md);font-weight:700;border:none;font-family:var(--font);cursor:pointer;margin-top:var(--s2);}

.pg{position:absolute;top:0;left:0;right:0;bottom:0;padding:var(--top) 0 calc(var(--btab-h) + 24px);overflow-y:auto;overflow-x:hidden;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none;scrollbar-width:none;}
.pg::-webkit-scrollbar{display:none;}
.pg.on{opacity:1;transform:translateY(0);pointer-events:auto;}
.px{padding:0 var(--gut);}
.btab{position:absolute;bottom:0;left:0;right:0;height:var(--btab-h);background:var(--bg);border-top:1px solid var(--line);
 display:flex;align-items:flex-start;justify-content:space-around;padding:var(--s1) var(--s6) env(safe-area-inset-bottom, 0px);z-index:40;}
.bt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);font-size:var(--f-xs);font-weight:700;color:var(--t4);cursor:pointer;padding:var(--s2) var(--s4);min-height:52px;transition:color .2s var(--ease);}
.bt.on{color:var(--greenD);}
.bt svg{width:24px;height:24px;stroke-width:2;}

/* ===== 오늘 ===== */
.p1-meta{font-size:var(--f-sm);color:var(--t3);font-weight:700;line-height:1.5;}
.p1-head{margin:var(--s1) 0 var(--s6);}
/* 새로 만들기 — 마스코트와 같은 노란 별. 주 버튼(초록)과 색이 겹치지 않는다 */
.newfab{position:absolute;right:var(--gut);bottom:calc(var(--btab-h) + 16px);z-index:41;
 display:none;flex-direction:column;align-items:center;justify-content:center;gap:1px;
 width:96px;height:96px;border:none;border-radius:50%;background:var(--card);color:var(--t1);
 font-family:var(--font);font-size:var(--f-xs);font-weight:900;letter-spacing:-.01em;cursor:pointer;
 outline:3px solid var(--pop);outline-offset:-3px;
 transition:transform .18s var(--pop-ease);}
.newfab.show{display:flex;}
.newfab:active{transform:scale(.94);}
.newfab svg{width:46px;height:46px;flex:none;margin-top:-2px;transition:transform .45s var(--pop-ease);}
.newfab.open svg{transform:rotate(72deg) scale(.86);}
.h1{font-size:var(--f-2xl);font-weight:900;color:var(--t1);letter-spacing:-.014em;line-height:1.3;margin-top:var(--s2);}
.now-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pls 2s ease-in-out infinite;flex-shrink:0;}
/* ===== 세션 카드 =====
   찹을 낱개로 흩어 놓으면 "할 일이 여러 개"로 읽힌다.
   한 덩어리 안에 넣고 재생 버튼 하나를 두면 "이 안에 다 한다"로 읽힌다. */
.sess{background:var(--card);border-radius:var(--r-xl);padding:var(--s6);margin-bottom:var(--s3);
 outline:1px solid var(--line);outline-offset:-1px;}
.sess.in{animation:cardIn .44s var(--pop-ease) both;}
.srow.in{animation:rowIn .34s var(--pop-ease) both;}
.sess-bar{flex:1;height:8px;border-radius:var(--r-full);background:var(--fill2);overflow:hidden;}
.sess-fill{height:100%;border-radius:var(--r-full);transition:width .45s var(--ease);}
.empty svg{animation:bob 3.4s ease-in-out infinite;}
.sess-h{display:flex;align-items:flex-start;gap:var(--s3);}
.sess-ic svg,.pd-ic svg{display:block;}
.ico{display:block;flex:none;}
.sess-ic{width:46px;height:46px;flex-shrink:0;border-radius:var(--r-md);background:var(--fill);
 outline:1px solid var(--line2);outline-offset:-1px;
 display:flex;align-items:center;justify-content:center;overflow:hidden;}
.sess-ic .ico{width:22px;height:22px;flex:none;}
.sess-hb{flex:1;min-width:0;padding-top:2px;}
.sess-x{width:34px;height:34px;flex-shrink:0;margin-top:6px;border:none;border-radius:50%;
 background:var(--fill);color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;
 position:relative;transition:transform .15s var(--ease),background-color .2s var(--ease),color .2s var(--ease);}
.sess-x::after{content:'';position:absolute;inset:-6px;}
.sess-x svg{width:15px;height:15px;}
.sess-x:active{transform:scale(.9);}
.sess-lbl{flex-shrink:0;display:flex;align-items:center;gap:var(--s1);font-size:var(--f-xs);font-weight:800;letter-spacing:.05em;
 background:var(--fill);border-radius:var(--r-full);padding:var(--s1) var(--s2);margin-top:4px;}
.sess-t{font-size:var(--f-xl);font-weight:800;color:var(--t1);letter-spacing:-.022em;line-height:1.3;text-wrap:balance;}
.sess-sub{font-size:var(--f-sm);font-weight:600;color:var(--t3);line-height:1.45;margin-top:4px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sess-prog{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4);}
.sess-cnt{flex-shrink:0;font-size:var(--f-sm);font-weight:900;font-variant-numeric:tabular-nums;}
.sess-ring{width:56px;height:56px;flex-shrink:0;}
.sess.compact{cursor:pointer;transition:transform .15s var(--ease);}
.sess.compact:active{transform:scale(.99);}
.sess-c{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3);overflow:hidden;max-height:1200px;opacity:1;transition:max-height .34s var(--ease),opacity .24s var(--ease),margin-top .34s var(--ease);}
.sess-c.hide{max-height:0;opacity:0;margin-top:0;}
.sess-more{width:100%;margin-top:var(--s3);min-height:40px;display:flex;align-items:center;justify-content:center;gap:var(--s1);
 background:none;border:none;font-family:var(--font);font-size:var(--f-xs);font-weight:800;color:var(--t3);cursor:pointer;
 letter-spacing:.02em;transition:color .2s var(--ease);}
.sess-more:active{color:var(--t1);}
.sess-more svg{width:13px;height:13px;transition:transform .3s var(--pop-ease);}
.sess-more.open svg{transform:rotate(180deg);}
.srow{display:flex;align-items:center;gap:var(--s3);background:var(--fill);border-radius:var(--r-sm);padding:var(--s2) var(--s3);min-height:48px;transition:opacity .3s var(--ease),background-color .3s var(--ease);}
.srow span{flex:1;min-width:0;font-size:var(--f-base);font-weight:700;color:var(--t1);line-height:1.4;}
.srow.dn{opacity:.62;}
.srow span{transition:color .3s var(--ease);}
.srow.dn span{text-decoration:line-through;color:var(--t3);font-weight:500;}
.sess-go{margin-top:var(--s5);min-height:58px;width:100%;border:none;border-radius:var(--r-full);background:var(--green);color:var(--onGreen);font-size:var(--f-lg);font-weight:900;display:flex;align-items:center;justify-content:center;gap:var(--s2);cursor:pointer;font-family:var(--font);transition:transform .15s var(--ease);}
.sess-go:active{transform:scale(.96);}
.sess-go svg{width:18px;height:18px;}
.sess.dn{opacity:.55;}
.sess.dn .sess-t{font-size:var(--f-lg);}
.start{text-align:center;padding:var(--s8) var(--s3) var(--s6);}
.start-t{font-size:var(--f-2xl);font-weight:900;color:var(--t1);letter-spacing:-.014em;line-height:1.3;}
.start-s{font-size:var(--f-md);color:var(--t3);margin-top:var(--s2);line-height:1.55;text-wrap:pretty;}
.start-b{margin-top:var(--s7);min-height:58px;padding:0 var(--s8);border:none;border-radius:var(--r-full);
 background:var(--green);color:var(--onGreen);font-family:var(--font);font-size:var(--f-lg);font-weight:900;
 cursor:pointer;transition:transform .15s var(--ease);}
.start-b:active{transform:scale(.96);}
.start svg{animation:bob 3.4s ease-in-out infinite;}

/* ===== 세그먼트 컨트롤 ===== */
.tabr{display:flex;background:var(--fill);border-radius:var(--r-md);padding:var(--s1);margin-bottom:var(--s4);}
.tab{flex:1;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;gap:var(--s1);border-radius:var(--r-sm);font-size:var(--f-md);font-weight:700;color:var(--t3);cursor:pointer;transition:background-color .25s var(--ease),color .25s var(--ease);}
.tab.on{background:var(--card);color:var(--t1);}
.tab .bd{display:inline-flex;min-width:18px;height:18px;border-radius:var(--r-full);font-size:var(--f-xs);font-weight:800;align-items:center;justify-content:center;padding:0 var(--s1);font-variant-numeric:tabular-nums;}
.tab.on .bd{background:var(--greenL);color:var(--greenD);}
.tab:not(.on) .bd{background:var(--fill2);color:var(--t3);}

/* ===== 찹 줄 ===== */
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);cursor:pointer;position:relative;transition:background-color .25s var(--pop-ease),border-color .25s var(--pop-ease);}
.ck::after{content:'';position:absolute;inset:-10px;}  /* 44px 터치 타깃 */
.ck.v{background:var(--green);border-color:transparent;}
.ck svg{width:13px;height:13px;color:var(--onGreen);stroke-width:3;opacity:0;transform:scale(.25);transition:opacity .2s var(--ease),transform .2s var(--pop-ease);}
.ck.v svg{opacity:1;transform:scale(1);}
.undo{position:absolute;bottom:calc(var(--btab-h) + 84px);left:var(--gut);right:var(--gut);z-index:44;border-radius:var(--r-md);background:var(--t1);color:#fff;padding:var(--s3) var(--s4);border-radius:var(--r-md);font-size:var(--f-md);font-weight:600;display:none;align-items:center;justify-content:space-between;z-index:42;}
.undo.show{display:flex;}
.undo-b{color:var(--green);font-weight:800;cursor:pointer;padding:var(--s1) var(--s2);}
.empty{text-align:center;padding:var(--s8) var(--s5);color:var(--t3);font-size:var(--f-base);line-height:1.65;text-wrap:pretty;}

/* ===== 오버레이 화면 공통 ===== */
.pdetail,.sp,.result{position:absolute;inset:0;background:var(--bg);padding:var(--top) var(--gut) calc(env(safe-area-inset-bottom, 0px) + 32px);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .3s;scrollbar-width:none;}
.pdetail::-webkit-scrollbar,.sp::-webkit-scrollbar,.result::-webkit-scrollbar{display:none;}
.pdetail{z-index:52;}.sp{z-index:53;}.result{z-index:54;}
.pdetail.on,.sp.on,.result.on{opacity:1;pointer-events:auto;}

/* ===== 기록 · 상세 ===== */
.sec-l{font-size:var(--f-xs);font-weight:800;color:var(--t4);letter-spacing:.05em;margin:var(--s6) 0 var(--s3);}
.dchop{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-sm);margin-bottom:var(--s2);font-size:var(--f-base);font-weight:600;color:var(--t1);min-height:52px;}
.dchop .ck{width:22px;height:22px;}
.dchop-n{flex:1;}.dchop.dn .dchop-n{text-decoration:line-through;color:var(--t3);}
.taj{width:32px;height:32px;border-radius:50%;background:var(--fill);border:none;font-size:var(--f-md);font-weight:900;color:var(--t2);cursor:pointer;}
.tav{font-size:var(--f-xs);font-weight:800;color:var(--t2);min-width:36px;text-align:center;font-variant-numeric:tabular-nums;}
.arm{background:var(--danger-bg)!important;color:var(--danger-ink)!important;}
.delx{width:32px;height:32px;border-radius:50%;background:var(--fill);border:none;color:var(--t3);font-size:var(--f-sm);cursor:pointer;flex-shrink:0;position:relative;}
.delx::after{content:'';position:absolute;inset:-6px;}
.deco-sum{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:none;border-radius:var(--r-md);padding:var(--s4);margin-top:var(--s6);min-height:56px;font-family:var(--font);cursor:pointer;}
.deco-l{font-size:var(--f-base);font-weight:800;color:var(--t1);}
.deco-r{display:flex;align-items:center;gap:var(--s3);}
.deco-dot{width:22px;height:22px;border-radius:50%;display:inline-block;outline:1px solid var(--line);outline-offset:-1px;}

function aiParse(txt){
 let t=String(txt||'').trim();
 t=t.replace(/^```[a-zA-Z]*\s*/,'').replace(/```\s*$/,'').trim();
 const a=t.indexOf('{'),b=t.lastIndexOf('}');
 if(a<0||b<=a)throw new Error('JSON을 찾지 못했어요');
 return JSON.parse(t.slice(a,b+1));
}

// ===== 챱챱: AI는 후보를 대고, 선택은 사용자가 한다 =====

const AI_SYS_CAND=`당신은 태스크 분해 앱 "찹찹"의 후보 생성기입니다.

# 핵심
당신은 최종 목록을 정하지 않습니다. 사용자가 고를 **선택지**를 만듭니다.
그래서 필요한 것보다 넉넉히, 서로 겹치지 않게 제시하세요.
사용자의 집이 어떤지 루틴이 뭔지 당신은 모릅니다. 아는 척하지 말고 선택지를 주세요.

# 후보 작성 규칙
1. 10~14개. 동사로 끝낸다("…하기").
2. 누구나 아는 보편적이고 구체적인 행동으로 쓴다.
   O "세안하기" "양치하기" "영양제 먹기" "내일 입을 옷 꺼내두기"
   X "잠자기 전 준비 준비하기" "핵심 작업 진행하기"
3. **제목을 되풀이하지 않는다. 속 빈 동사(준비/진행/마무리/점검)만으로 만들지 않는다.**
4. 이름은 한글 20자 이하.
5. 한 후보는 5~15분짜리로 둔다. 30분 넘는 덩어리는 후보로 내지 않는다.
   minutes는 실제로 걸리는 시간을 정직하게. 10분 미만은 1분 단위(영양제 먹기 2분, 양치하기 3분),
   10분 이상은 5분 단위. 짧은 일을 5분으로 올리지 않는다.
6. 흔한 것부터 덜 흔한 것 순으로 놓는다. 사람마다 다를 법한 것도 넣되 뒤쪽에 둔다.
7. 서로 포함관계가 되지 않게 한다.
8. **하나의 후보 = 하나의 행동.** "…하고 …하기"처럼 두 가지를 묶지 않는다.
   X "씻고 정리 끝내기" "분류하고 세탁 돌리기"
   O "세안하기" / "옷 정리하기" / "빨랫감 분류하기" / "세탁기 돌리기"

async function aiCandidates(title){
 const u='제목: '+title+'\n사용자가 지금 당장 시작해서 한 번에 끝내려는 일입니다.';
 const d=await aiCall2(u,1);
 const list=(Array.isArray(d.candidates)?d.candidates:[]).filter(c=>c&&c.name).map(c=>({
  name:String(c.name).trim().slice(0,28),
  minutes:snapMin(c.minutes||10),sel:false}));
 return {status:d.status||'ok',items:list,message:String(d.message||'')};
}
async function aiCall2(user,retries){
 const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
  headers:{'content-type':'application/json','x-api-key':aiKey(),
   'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:AI_MODEL,max_tokens:4000,output_config:{effort:'low'},
   system:AI_SYS_CAND,messages:[{role:'user',content:user}]})});
 if(!res.ok){let d='';try{d=(await res.text()).slice(0,140);}catch(e){}
  throw new Error('API '+res.status+(d?' · '+d:''));}
 const j=await res.json();
 const txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
 try{return aiParse(txt);}
 catch(err){if(retries>0)return aiCall2(user+'\n\n반드시 JSON 객체 하나만 출력하세요.',retries-1);throw err;}
}

 const pick=arr=>arr.filter(r=>{if(dup(r[0])||seen[r[0]])return false;seen[r[0]]=1;return true;});
 let out=pick(rows);
 if(shown.length)out=out.concat(pick(EXTRA));
 else out=out.slice(0,10);   // 첫 판에 다 쏟지 않는다. 더 보고 싶을 때 남겨 둔다
 return out.map(r=>({name:r[0],minutes:r[1],sel:false}));
}

// 별이 터지면서 찹이 함께 나온다.
const SLASH_MS=2400;   // 별이 터지고 0.5초 뒤에 찹이 나온다
const CUTS=[            // [각도, 칼 시작, 컷선 id, 컷선 시작] — 칼과 컷선이 같은 각도를 쓴다
 ['-14deg',150,'cut1',290],

];

function burst(st,count){
 for(let i=0;i<count;i++){
  const p=document.createElement('i');
  p.className='spark'+(i%2?' g2':'')+(i%3===0?' big':'');
  const ang=(i/count)*Math.PI*2+(Math.random()-.5)*.34;   // 균등 배치 + 살짝만 흔들기
  const dist=108+Math.random()*64;   // 별이 커진 만큼 더 멀리 퍼진다
  p.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(0)+'px');
  p.style.setProperty('--dy',(Math.sin(ang)*dist*.86).toFixed(0)+'px');
  p.style.left='50%';p.style.top='48%';                   // 말풍선 중심
  p.style.animationDelay=(i%4)*26+'ms';
  st.appendChild(p);void p.offsetWidth;p.classList.add('go');
  setTimeout(()=>p.remove(),1400);
 }
}
function slashAnim(){
 const k=document.getElementById('candKnife'),thb=document.getElementById('thb'),
       st=document.querySelector('.cand-stage');
 if(!k||!thb||!st)return;
 slashTimers.forEach(clearTimeout);slashTimers=[];
 k.classList.remove('go');   // SVG는 className 대입이 안 먹는다
 thb.classList.remove('split');
 CUTS.forEach(c=>{const el=document.getElementById(c[2]);if(el)el.classList.remove('go');});
 st.querySelectorAll('.spark').forEach(e=>e.remove());
 void k.getBoundingClientRect();
 slashAt=Date.now();
 st.classList.remove('gone');
 const scr=document.getElementById('candScr');
 if(scr)scr.classList.add('solo');
 const T=(fn,ms)=>slashTimers.push(setTimeout(fn,ms));
 CUTS.forEach(([ang,kt,cid,ct])=>{
  T(()=>{k.classList.remove('go');void k.getBoundingClientRect();
   k.style.setProperty('--kr',ang);k.classList.add('go');},kt);
  T(()=>{const el=document.getElementById(cid);
   if(el){el.classList.remove('go');void el.getBoundingClientRect();el.classList.add('go');}},ct);
 });
 T(()=>thb.classList.add('split'),1360);
 T(()=>burst(st,14),BURST_AT);          // 화면 한가운데서 크게 터진다
 T(()=>{const sc=document.getElementById('candScr');if(sc)sc.classList.remove('solo');},2330);

 const d=await aiCall2(u,1);

const H_VALS=[0,1,2,3,4,5];
const M_VALS=[0,5,10,15,20,25,30,35,40,45,50,55];
const WHEEL_H=44;
let wSel={h:0,m:6},wBusy=0;   // 기본 30분
function wheelTotal(){return H_VALS[wSel.h]*60+M_VALS[wSel.m];}
function fmtMin(t){t=Math.max(0,Math.round(t));
 const h=Math.floor(t/60),m=t%60;
 return h?(h+'시간'+(m?' '+m+'분':'')):(m+'분');}
// 링 안에 들어갈 짧은 표기
function fmtShort(t){t=Math.max(0,Math.round(t));

function wheelMarkup(){
 const col=(id,vals,unit,label)=>'<div class="wheel"><div class="wheel-list" id="'+id+'" tabindex="0" role="slider" aria-label="'+label+'" aria-valuemin="'+vals[0]+'" aria-valuemax="'+vals[vals.length-1]+'">'
  +vals.map(v=>'<i>'+v+'<small>'+unit+'</small></i>').join('')+'</div></div>';
 return '<div class="wheels"><div class="wheel-band"></div>'
  +col('wH',H_VALS,'시간','시간')+col('wM',M_VALS,'분','분')+'</div>'
  +'<button class="wheel-go" id="wGo" onclick="pickMins(wheelTotal())"></button>';
}
function paintGo(){

 b.disabled=t<5;
 b.textContent=t<5?'5분 이상으로 맞춰 주세요':(fmtMin(t)+'으로 시작');
}
function wheelEl(w){return document.getElementById(w==='h'?'wH':'wM');}
function wheelVals(w){return w==='h'?H_VALS:M_VALS;}
function wheelPaint(w,i){
 const L=wheelEl(w),vals=wheelVals(w);if(!L)return;
 L.querySelectorAll('i').forEach((e,k)=>e.classList.toggle('on',k===i));
 L.setAttribute('aria-valuenow',vals[i]);

}
// 프로그램이 굴리는 동안에는 onscroll이 물러난다 —
// 부드러운 스크롤이 끝나기 전에 옛 scrollTop을 읽어 값을 되돌리던 버그가 있었다.
function setWheel(w,i,smooth){
 const L=wheelEl(w),vals=wheelVals(w);if(!L)return;
 i=Math.max(0,Math.min(vals.length-1,i));
 wSel[w]=i;wheelPaint(w,i);
 wBusy++;
 L.scrollTo({top:i*WHEEL_H,behavior:smooth?'smooth':'auto'});
 setTimeout(()=>{wBusy=Math.max(0,wBusy-1);},smooth?420:80);
}
function bindWheel(w){
 const L=wheelEl(w),vals=wheelVals(w);if(!L)return;
 const read=()=>{if(wBusy)return;
  const i=Math.max(0,Math.min(vals.length-1,Math.round(L.scrollTop/WHEEL_H)));
  wSel[w]=i;wheelPaint(w,i);};
 let t=null;
 L.onscroll=()=>{if(t)clearTimeout(t);t=setTimeout(read,40);};
 // 바깥 스크롤러에 제스처를 뺏기지 않도록 직접 처리한다
 L.onwheel=e=>{e.preventDefault();e.stopPropagation();setWheel(w,wSel[w]+(e.deltaY>0?1:-1),true);};
 L.onkeydown=e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();setWheel(w,wSel[w]+1,true);}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();setWheel(w,wSel[w]-1,true);}
  else if(e.key==='Enter'){e.preventDefault();if(wheelTotal()>=5)pickMins(wheelTotal());}
 };
 // 드래그로도 굴러가게 (마우스·펜)
 let dy=0,st=0,drag=false;
 L.onpointerdown=e=>{if(e.pointerType==='touch')return;drag=true;dy=e.clientY;st=L.scrollTop;L.setPointerCapture(e.pointerId);};
 L.onpointermove=e=>{if(!drag)return;L.scrollTop=st-(e.clientY-dy);};
 L.onpointerup=()=>{if(!drag)return;drag=false;setWheel(w,Math.round(L.scrollTop/WHEEL_H),true);};
 setWheel(w,wSel[w],false);
}

function disarm(){if(armB){armB.classList.remove('arm');if(armOld)armB.textContent=armOld;}armK=null;armB=null;armT=null;armOld='';}
function ask(key,btn,label){
 if(armK===key){clearTimeout(armT);disarm();return true;}
 clearTimeout(armT);disarm();
 armK=key;armB=btn||null;
 if(btn){armOld=label?btn.textContent:'';btn.classList.add('arm');if(label)btn.textContent=label;}
 armT=setTimeout(disarm,2800);
 return false;
}
function cancelRes(btn){if(pendR&&!ask('res',btn))return;document.getElementById('resScr').classList.remove('on');pendR=null;goTab('p1',0);}
function confirmRes(){if(!pendR)return;document.getElementById('resScr').classList.remove('on');
 const nid=Date.now();
 items.push({id:nid,type:'project',name:pendR.title,color:pendR.color,icon:pendR.icon||'pencil',chops:pendR.chops,day:todayKey(),sessionMin:pendR.sessionMin||30});
 activeId=nid;
 renderAll();goTab('p1',0);pendR=null;
 startSession(nid);   // "시작하기"는 시작해야 한다. 뒤로 나가면 카드는 홈에 남는다
}
function goTab(id,idx){document.querySelectorAll('.pg').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.bt').forEach(t=>t.classList.remove('on'));document.querySelectorAll('.bt')[idx].classList.add('on');if(id==='p1'){animToday=true;renderToday();}else{const nf=document.getElementById('newFab');if(nf)nf.classList.remove('show');}}
function nav(id,el){document.querySelectorAll('.pg').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');
document.querySelectorAll('.bt').forEach(t=>t.classList.remove('on'));if(el)el.classList.add('on');clC();stopTmr();closePD();closeSP();if(id==='p1'){animToday=true;renderToday();}else{const nf=document.getElementById('newFab');if(nf)nf.classList.remove('show');}}
// date helpers
function dk(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function todayKey(){return dk(new Date());}
function renderAll(){renderToday();renderLog();renderStats();save();}
function esc(s){return s.replace(/'/g,"\\'");}
const PLAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>';
// 세션 하나 = 카드 하나. 카드 안에 찹이 전부 들어가고, 재생 버튼은 하나뿐이다.
let openSess={};   // 카드별 펼침 상태. items에 섞지 않는다
// 카드는 상태마다 다른 것을 말한다.
//  시작 전 : 무엇을 · 얼마나          (진행 바는 0%라 정보가 없다)
//  진행 중 : 다음에 할 것 · 어디까지 왔나
//  끝냄   : 얼마 걸리는 세션이었나
// compact(기록 탭)는 같은 카드에서 버튼만 뺀 것이다 — 화면마다 다른 모양을 쓰지 않는다.
function sessCard(it,opt){
 opt=opt||{};
 const anim=opt.anim,base=(opt.ord||0)*90,compact=!!opt.compact;
 const op=compact?false:!!openSess[it.id];
 const total=it.chops.length,done=it.chops.filter(c=>c.done).length,left=total-done;
 const started=done>0&&left>0;
 const ink=cink(it.color.c);
 const nxc=it.chops.find(c=>!c.done);
 const d=document.createElement('div');
 d.className='sess'+(left?'':' dn')+(anim?' in':'')+(compact?' compact':'');

 const sub=left
   ?(started?('다음 · '+nxc.name):('찹 '+total+'개 · '+fmtMin(it.sessionMin||30)))
   :(fmtMin(it.sessionMin||30)+' 세션 · '+total+'개 다 끝냄');

 let h='<div class="sess-h">'
  +'<div class="sess-ic">'+(left?iconSvg(safeIcon(it),ink,22):'<svg viewBox="0 0 24 24" fill="none" stroke="'+ink+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M5 12l5 5L19 7"/></svg>')+'</div>'
  +'<div class="sess-hb"><div class="sess-t">'+it.name+'</div>'
  +'<div class="sess-sub">'+sub+'</div></div>'
  +(opt.cur?'<div class="sess-lbl" data-ink><div class="now-dot" data-bg></div>지금</div>':'')
  +(compact?'':'<button class="sess-x" aria-label="이 찹찹 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>')
  +'</div>';

 const resum=(tmrPid===it.id&&tSec>0&&tSec<tTotal);
 if(resum&&!compact){
  // 타이머를 돌리다 나온 세션은 시간이 얼마나 남았는지가 가장 궁금하다
  const c=2*Math.PI*22,k=Math.max(0,Math.min(1,tSec/tTotal)),L=c*k;
  h+='<div class="sess-prog"><svg class="sess-ring" viewBox="0 0 56 56" aria-hidden="true">'
   +'<circle cx="28" cy="28" r="22" fill="none" stroke="var(--segOff)" stroke-width="5"/>'
   +'<circle cx="28" cy="28" r="22" fill="none" stroke="'+ink+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+L+' '+(c-L)+'" stroke-dashoffset="'+L+'" transform="rotate(-90 28 28)"/>'
   +'<text x="28" y="28" text-anchor="middle" dominant-baseline="central" fill="'+ink+'" font-size="12" font-weight="900">'+fmtShort(Math.ceil(tSec/60))+'</text></svg>'
   +'<span class="sess-cnt" data-ink>찹 '+done+'/'+total+'</span></div>';
 }else if(started){
  h+='<div class="sess-prog"><div class="sess-bar"><div class="sess-fill" data-w="'+Math.round(done/total*100)+'"></div></div>'
   +'<span class="sess-cnt" data-ink>'+done+'/'+total+'</span></div>';
 }

 if(!compact){
  if(left)h+='<button class="sess-go">'+PLAY+(resum?('이어서 · '+fmtMin(Math.ceil(tSec/60))):(fmtMin(it.sessionMin||30)+' 시작'))+'</button>';
  h+='<button class="sess-more'+(op?' open':'')+'" aria-expanded="'+(op?'true':'false')+'"><span>'+(op?'접기':('찹 '+total+'개 보기'))+'</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>';
  h+='<div class="sess-c'+(op?'':' hide')+'">';
  it.chops.forEach((c,i)=>{h+='<div class="srow'+(c.done?' dn':'')+(anim?' in':'')+'"><div class="ck'+(c.done?' v':'')+'" data-i="'+i+'">'+chk+'</div><span>'+c.name+'</span></div>';});
  h+='</div>';
 }
 d.innerHTML=h;
 // 문자열이 아니라 프로퍼티로 칠한다
 const icEl=d.querySelector('.sess-ic');if(icEl)icEl.style.background=cbg(it.color.bg);
 const fl=d.querySelector('.sess-fill');
 if(fl){fl.style.width=fl.dataset.w+'%';fl.style.background=ink;}
 d.querySelectorAll('[data-ink]').forEach(e=>{e.style.color=ink;});
 d.querySelectorAll('[data-bg]').forEach(e=>{e.style.background=ink;});
 if(anim){d.style.animationDelay=base+'ms';
  d.querySelectorAll('.srow').forEach((e,i)=>{e.style.animationDelay=(base+150+i*45)+'ms';});}
 if(compact){d.onclick=()=>openPD(it.id);return d;}
 d.querySelectorAll('.ck').forEach(el=>{el.onclick=e=>{e.stopPropagation();
  const c=it.chops[+el.dataset.i];(c.done?uncomp:comp)(c.name,it.id);};});
 const go=d.querySelector('.sess-go');if(go)go.onclick=()=>startSession(it.id);
 const xb=d.querySelector('.sess-x');
 if(xb)xb.onclick=e=>{e.stopPropagation();delItem(it.id,xb);};
 const mo=d.querySelector('.sess-more');
 if(mo)mo.onclick=()=>{const now=!openSess[it.id];openSess[it.id]=now;
  d.querySelector('.sess-c').classList.toggle('hide',!now);
  mo.classList.toggle('open',now);
  mo.setAttribute('aria-expanded',now?'true':'false');
  mo.querySelector('span').textContent=now?'접기':('찹 '+it.chops.length+'개 보기');};
 return d;
}
// 재생을 누르면 세션 전체 시간이 돌기 시작하고, 찹은 그 안에서 하나씩 지워진다.
function startSession(pid){
 const p=items.find(i=>i.id===pid);if(!p)return;
 activeId=pid;
 const nx=(p.chops||[]).find(c=>!c.done);if(!nx)return;
 curNow={...nx,proj:p.name,pid:p.id,color:p.color,smin:p.sessionMin||30};
 startTmr();
}
// 이 앱은 "지금 하나"다. 목록을 쌓으면 다시 할 일 앱이 된다.
// 홈에는 지금 붙잡고 있는 세션 하나만 둔다. 나머지는 '이어서 할 찹찹'으로 물러난다.
// 전에는 가장 최근 미완료 세션을 자동으로 끌어올렸는데,
// "기록으로 물러나요"라고 해놓고 슬그머니 돌아와서 말과 동작이 어긋났다.
let activeId=null;
function liveSess(){
 const it=items.find(i=>i.id===activeId);
 return (it&&it.chops&&it.chops.some(c=>!c.done))?it:null;
}
function restSess(){
 return items.filter(i=>i.type==='project'&&i.chops&&i.chops.length
  &&i.chops.some(c=>!c.done)&&i.id!==activeId);
}
function renderToday(){
 const t0=document.getElementById('t0');t0.innerHTML='';
 const cur=liveSess();
 if(curNow&&curNow.done)curNow=null;
 const an=animToday;animToday=false;
 // 시작 화면에는 자기 제목과 버튼이 이미 있다. 위에 또 얹지 않는다.
 const hd=document.getElementById('p1Head');if(hd)hd.style.display=cur?'':'none';
 const nf=document.getElementById('newFab');
 if(nf)nf.classList.toggle('show',!!cur&&document.getElementById('p1').classList.contains('on'));
 if(cur){
  if(!(cur.id in openSess))openSess[cur.id]=true;   // 하나뿐이니 펼쳐 둔다
  t0.appendChild(sessCard(cur,{anim:an,ord:0}));
 }else{
  const t=todayKey();
  const doneToday=items.filter(i=>(i.day||t)===t&&i.chops&&i.chops.length&&i.chops.every(c=>c.done)).length;
  t0.innerHTML='<div class="start"><svg viewBox="0 0 80 80" width="104" height="104" style="display:block;margin:0 auto var(--s5);"><path d="M40 6 Q44 20 56 14 Q52 28 66 28 Q56 36 60 50 Q46 42 40 55 Q34 42 20 50 Q24 36 14 28 Q28 28 24 14 Q36 20 40 6Z" fill="#FFD23F" stroke="#2E2A24" stroke-width="2.2" stroke-linejoin="round"/><path d="M33 30 Q35 34 37 30M43 30 Q45 34 47 30" fill="none" stroke="#2E2A24" stroke-width="2" stroke-linecap="round"/><path d="M35 38 Q40 44 45 38" fill="none" stroke="#2E2A24" stroke-width="2" stroke-linecap="round"/></svg>'
   +'<div class="start-t">'+(doneToday?('오늘 '+doneToday+'개 끝냈어요'):'무엇부터 할까요')+'</div>'
   +'<div class="start-s">'+(doneToday?'더 할 게 있으면 또 잘라 볼게요':'할 일 하나를 적으면 잘게 잘라 줄게요')+'</div>'
   +'<button class="start-b" onclick="tgC()">찹찹 시작하기</button></div>';
 }
 // 접어 둔 찹찹은 사용자가 가져올 때만 홈으로 온다
 const rest=restSess();
 if(rest.length){
  const l=document.createElement('div');l.className='sec-l';l.textContent='이어서 할 찹찹 '+rest.length;
  t0.appendChild(l);
  rest.slice().reverse().forEach((it,k)=>{
   const c=sessCard(it,{compact:1,anim:an,ord:k+1});
   c.onclick=()=>resumeById(it.id);
   t0.appendChild(c);});
 }
 renderStats();
}
// 접어 둔 찹찹을 홈으로 가져온다
function resumeById(id){
 const it=items.find(x=>x.id===id);if(!it)return;
 activeId=id;openSess[id]=true;animToday=true;
 renderAll();goTab('p1',0);
}
// 토스트 하나로 모은다. 되돌릴 게 있으면 버튼이 붙고, 없으면 문구만 뜬다.
let toastT=null,undoFn=null;
function toast(msg,undoLabel,fn){
 const el=document.getElementById('undoT'),b=document.getElementById('undoBtn');
 document.getElementById('undoMsg').textContent=msg;
 undoFn=fn||null;
 b.textContent=undoLabel||'';
 b.style.display=fn?'':'none';
 el.classList.add('show');
 clearTimeout(toastT);
 toastT=setTimeout(()=>el.classList.remove('show'),fn?4200:2600);
}
function undoAct(){const f=undoFn;undoFn=null;
 document.getElementById('undoT').classList.remove('show');
 if(f)f();}
function comp(n,pid){items.forEach(p=>{if(p.id===pid&&p.chops)p.chops.forEach(c=>{if(c.name===n){c.done=true;}});});if(curNow&&curNow.name===n&&curNow.pid===pid)curNow=null;lastC={n,pid};renderAll();toast('완료됨','되돌리기',()=>{uncomp(n,pid);lastC=null;});}
function uncomp(n,pid){items.forEach(p=>{if(p.id===pid&&p.chops)p.chops.forEach(c=>{if(c.name===n){c.done=false;}});});renderAll();}
// ===== 기록 =====
// 이 앱에는 미래가 없다. 오늘 만들어 오늘 끝내는 세션뿐이라, 달력 대신 지나간 기록만 쌓인다.
function renderLog(){
 const el=document.getElementById('dayItems');el.innerHTML='';
 if(!items.length){el.innerHTML='<div class="empty">아직 기록이 없어요<br>+ 를 눌러 만들 수 있어요</div>';return;}
 const t=todayKey(),y=ydk();
 const groups=[['오늘',[]],['어제',[]],['지난 기록',[]]];
 items.slice().sort((a,b)=>(b.day||0)-(a.day||0)||b.id-a.id).forEach(it=>{
  const d=it.day||t;
  groups[d===t?0:(d===y?1:2)][1].push(it);});
 groups.forEach(g=>{
  if(!g[1].length)return;
  const h=document.createElement('div');h.className='sec-l';h.textContent=g[0];el.appendChild(h);
  // 홈과 같은 카드다. 화면이 다르다고 모양을 바꾸지 않는다.
  g[1].forEach(it=>el.appendChild(sessCard(it,{compact:1})));
 });
}
// ===== DETAIL (editable) =====
function openPD(id){const it=items.find(i=>i.id===id);if(!it)return;editId=id;renderPD();document.getElementById('pdScr').classList.add('on');}
function renderPD(){
 const it=items.find(i=>i.id===editId);if(!it){closePD();return;}
 const done0=it.chops.filter(c=>c.done).length,ink0=cink(it.color.c);
 let h='<div class="sess pd-card"><div class="sess-h">'
  +'<div class="sess-ic" id="pdIc">'+iconSvg(safeIcon(it),ink0,22)+'</div>'
  +'<div class="sess-hb"><div class="sess-t">'+it.name+'</div>'
  +'<div class="sess-sub">'+(done0===it.chops.length
     ?(fmtMin(it.sessionMin||30)+' 세션 · '+it.chops.length+'개 다 끝냄')
     :('찹 '+it.chops.length+'개 · '+fmtMin(it.sessionMin||30)))+'</div></div></div></div>';
 // appearance (folded: 10 colours + 12 icons is a lot to face every time)
 const curIco=iconSvg(it.icon,'var(--t2)',18);
 h+='<button class="deco-sum" onclick="toggleDeco()" aria-expanded="'+(pdDeco?'true':'false')+'"><span class="deco-l">모양</span><span class="deco-r"><i class="deco-dot" id="pdDot"></i>'+curIco+'<span class="deco-cv">'+(pdDeco?'접기':'변경')+'</span></span></button>';
 if(pdDeco){
 h+='<div class="sec-l">색상</div><div class="colorpick">';
 PAL.forEach((col,i)=>{h+='<div class="cp'+(it.color.bg===col.bg?' sel':'')+'" onclick="setColor('+i+')"></div>';});h+='</div>';
 h+='<div class="sec-l">아이콘</div><div class="iconpick">';
 ICON_NAMES.forEach(nm=>{h+='<div class="ip'+(it.icon===nm?' sel':'')+'" onclick="setIcon(\''+nm+'\')">'+iconSvg(nm,'var(--t2)',20)+'</div>';});h+='</div>';
 }
 {
  const done=it.chops.filter(c=>c.done).length;
  h+='<div class="sec-l">찹 '+done+'/'+it.chops.length+'</div>';
  it.chops.forEach((c,i)=>{h+='<div class="dchop'+(c.done?' dn':'')+'" style="background:'+cbg(it.color.bg)+'"><div class="ck'+(c.done?' v':'')+'" onclick="toggleChop('+i+')">'+chk+'</div><span class="dchop-n">'+c.name+'</span><button class="delx" onclick="delChop('+i+',this)" aria-label="한 번 더 누르면 지워져요"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="width:12px;height:12px;"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';});
  h+='<button class="cta ghost" onclick="addChopManual()">+ 찹 직접 추가</button>';
 }
 if(it.chops.some(c=>!c.done))h+='<button class="cta" onclick="resumeItem()">이어서 시작</button>';
 else h+='<button class="cta ghost" onclick="repeatItem()">오늘 다시 하기</button>';
 h+='<button class="cta danger" onclick="delItem('+it.id+',this,\'한 번 더 누르면 삭제돼요\')">삭제</button>';
 document.getElementById('pdBody').innerHTML=h;
 const pi=document.getElementById('pdIc');if(pi)pi.style.background=cbg(it.color.bg);
 const pdt=document.getElementById('pdDot');if(pdt)pdt.style.background=cbg(it.color.bg);
 document.querySelectorAll('#pdBody .cp').forEach((e,i)=>{e.style.background=cbg(PAL[i].bg);});
}
// 기록에 남은 미완료 세션을 다시 집어 든다. 지금 탭의 주인이 바뀐다.
function resumeItem(){
 const it=items.find(x=>x.id===editId);if(!it)return;
 const id=it.id;
 // 배열 맨 뒤로 옮겨야 liveSess()가 이걸 '지금'으로 잡는다
 activeId=id;openSess[id]=true;
 closePD();renderAll();goTab('p1',0);startSession(id);
}
// 루틴(자동 반복)은 넣지 않는다. 사용자가 누를 때만 오늘로 복제한다.
function repeatItem(){
 const it=items.find(x=>x.id===editId);if(!it)return;
 const nid=Date.now();
 items.push({id:nid,type:'project',name:it.name,color:it.color,icon:it.icon,
  chops:it.chops.map(c=>({name:c.name,done:false})),day:todayKey(),sessionMin:it.sessionMin||30});
 activeId=nid;
 closePD();renderAll();goTab('p1',0);
}
let pdDeco=false;
function toggleDeco(){pdDeco=!pdDeco;renderPD();}
function setColor(i){const it=items.find(x=>x.id===editId);it.color=PAL[i];renderPD();renderAll();}
function setIcon(nm){const it=items.find(x=>x.id===editId);it.icon=nm;renderPD();renderAll();}
function toggleChop(i){const it=items.find(x=>x.id===editId);it.chops[i].done=!it.chops[i].done;renderPD();renderAll();}
function delChop(i,btn){const it=items.find(x=>x.id===editId);if(!ask('dc'+i,btn))return;it.chops.splice(i,1);renderPD();renderAll();}
function closePD(){pdDeco=false;document.getElementById('pdScr').classList.remove('on');editId=null;}
function delItem(id,btn,label){
 if(!ask('di',btn,label))return;
 const idx=items.findIndex(i=>i.id===id);if(idx<0)return;
 const gone=items[idx],wasActive=activeId===id;
 items.splice(idx,1);
 if(wasActive)activeId=null;
 if(tmrPid===id){tmrPid=null;stopTmr();}
 curNow=null;delete openSess[id];closePD();renderAll();
 toast('\''+gone.name+'\' 지웠어요','되돌리기',()=>{
  items.splice(Math.min(idx,items.length),0,gone);
  if(wasActive)activeId=id;
  renderAll();});
}
// 보여주는 건 전부 사실이다. 등급도 점수도 없다.
function renderStats(){
 let chops=0,sess=0,today=0;const t=todayKey();
 items.filter(i=>i.type==='project'&&i.chops).forEach(p=>{
  const d=p.chops.filter(c=>c.done).length;
  chops+=d;
  if(p.chops.length&&d===p.chops.length)sess++;
  if((p.day||t)===t)today+=d;});
 document.getElementById('myDn').textContent=sess;
 document.getElementById('myCh').textContent=chops;
 document.getElementById('myBio').textContent=sess?('세션 '+sess+'개 끝냈어요'):'아직 끝낸 세션이 없어요';
 const dt=document.getElementById('dateText');
 if(dt&&dt.dataset.day)dt.textContent=dt.dataset.day+(today?(' · 오늘 '+today+'개 끝냄'):'');
}
// ===== 소리 · 진동 =====
let actx=null;
function wakeAudio(){
 if(!settings.snd)return null;
 try{
  if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}
  if(actx.state==='suspended')actx.resume();
  return actx;
 }catch(e){return null;}
}
// kind: 'up' 시간이 다 됨(내려가는 두 음) · 'done' 다 끝냄(올라가는 세 음)
function chime(kind){
 const a=wakeAudio();if(!a)return;
 const seq=kind==='done'?[[659.3,0],[880,.16],[1174.7,.32]]:[[880,0],[659.3,.34]];
 const t0=a.currentTime+.02;
 seq.forEach(([f,dt])=>{
  const o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.value=f;
  const st=t0+dt;
  g.gain.setValueAtTime(0.0001,st);
  g.gain.exponentialRampToValueAtTime(0.08,st+.02);   // 작게 — 조용한 방에서도 놀라지 않을 크기
  g.gain.exponentialRampToValueAtTime(0.0001,st+.85);
  o.connect(g);g.connect(a.destination);
  o.start(st);o.stop(st+.9);
 });
}
// 진동은 안드로이드 크롬만 된다. 아이폰 사파리는 무시한다 — 있으면 좋고 없어도 그만.
function buzz(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}}

// ===== TIMER =====
// 아이폰 타이머와 같은 로직. 처음엔 원이 꽉 차 있고, 시간이 지나면
// **12시에서 오른쪽(시계방향)으로 지워진다.** 끝점은 12시에 고정된다.
const RING_R=95,RING_CX=110,RING_CY=110;
function ringCirc(){return 2*Math.PI*RING_R;}
function buildSeg(){
 const svg=document.getElementById('tmrSvg');svg.innerHTML='';
 const NS='http://www.w3.org/2000/svg';
 const mk=(id,color)=>{const c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',RING_CX);c.setAttribute('cy',RING_CY);c.setAttribute('r',RING_R);
  c.setAttribute('fill','none');c.setAttribute('stroke',color);c.setAttribute('stroke-width',12);
  c.setAttribute('transform','rotate(-90 '+RING_CX+' '+RING_CY+')');
  c.id=id;svg.appendChild(c);return c;};
 mk('segTrack','var(--segOff)');
 mk('segFill','var(--green)').setAttribute('stroke-linecap','round');
 updSeg();
}
function updSeg(){
 const c=document.getElementById('segFill');if(!c)return;
 const circ=ringCirc();
 const k=Math.max(0,Math.min(1,tTotal?tSec/tTotal:0));
 const L=circ*k;
 // dasharray로 남은 길이를 잡고, dashoffset=L 로 밀어 12시에 끝을 붙인다
 c.setAttribute('stroke-dasharray',L+' '+(circ-L));
 c.setAttribute('stroke-dashoffset',L);
}
// 세션 = 항목 하나. 타이머는 세션 전체 시간을 재고, 찹은 그 안에서 하나씩 지워 나간다.
function sessChops(){const p=items.find(i=>i.id===(curNow&&curNow.pid));return (p&&p.chops)||[];}
function renderTmrProg(){
 const cs=sessChops();if(!cs.length)return;
 const done=cs.filter(c=>c.done).length;
 const curIdx=cs.findIndex(c=>!c.done);
 document.getElementById('tmrCnt').textContent=Math.min(done+1,cs.length)+' / '+cs.length;
 document.getElementById('tmrDots').innerHTML=cs.map((c,i)=>
  '<i class="'+(c.done?'done':(i===curIdx?'cur':''))+'"></i>').join('');
}
// 타이머가 도는 동안에도 세션을 고친다. 위에서부터 하는 규칙이라 순서가 곧 계획이다.
function ordSess(){return items.find(i=>i.id===(curNow&&curNow.pid));}
function renderOrder(){
 const p=ordSess();const el=document.getElementById('ordList');if(!p||!el)return;
 el.innerHTML='';
 const last=p.chops.length<=1;
 p.chops.forEach((c,i)=>{
  const d=document.createElement('div');
  d.className='ordrow'+(c.done?' dn':'');
  d.innerHTML='<span class="ord-n">'+(i+1)+'</span><span class="ord-t">'+c.name+'</span>'
   +'<button class="ordb" data-a="up"'+(i===0?' disabled':'')+' aria-label="위로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>'
   +'<button class="ordb" data-a="dn"'+(i===p.chops.length-1?' disabled':'')+' aria-label="아래로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>'
   +'<button class="ordb del" data-a="x"'+(last?' disabled':'')+' aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>';
  d.querySelectorAll('.ordb').forEach(b=>{b.onclick=()=>{
   const a=b.dataset.a;
   if(a==='x')delOrdChop(i,b); else moveChop(i,a==='up'?-1:1);};});
  el.appendChild(d);});
 const m=document.getElementById('ordMin');
 if(m)m.textContent=fmtMin(p.sessionMin||30);
}
function moveChop(i,d){
 const p=ordSess();if(!p)return;
 const j=i+d;if(j<0||j>=p.chops.length)return;
 const t=p.chops[i];p.chops[i]=p.chops[j];p.chops[j]=t;
 renderOrder();renderTmrProg();save();
}
function delOrdChop(i,btn){
 const p=ordSess();if(!p||p.chops.length<=1)return;
 if(!ask('doc'+i,btn))return;
 p.chops.splice(i,1);
 renderOrder();renderTmrProg();syncCur();save();
}
function addOrdChop(){
 const el=document.getElementById('ordAdd'),p=ordSess();
 if(!el||!p)return;
 const v=el.value.trim();if(!v)return;
 p.chops.push({name:v.slice(0,28),done:false});
 el.value='';renderOrder();renderTmrProg();syncCur();save();
 el.focus();
}
// 세션 시간은 타이머가 도는 중에도 늘리고 줄인다. 남은 시간도 같은 만큼 따라간다.
function adjSess(d){
 const p=ordSess();if(!p)return;
 const cur=p.sessionMin||30;
 const nv=Math.max(5,Math.min(355,cur+d));
 if(nv===cur)return;
 p.sessionMin=nv;
 const delta=(nv-cur)*60;
 tTotal=Math.max(60,tTotal+delta);
 tSec=Math.max(1,Math.min(tTotal,tSec+delta));
 if(curNow)curNow.smin=nv;
 document.getElementById('ordMin').textContent=fmtMin(nv);
 document.getElementById('tmrFrom').textContent=fmtMin(nv)+' 세션';
 updTD();updSeg();save();
}
// 순서·삭제·추가 뒤에는 '지금 할 찹'이 달라질 수 있다
function syncCur(){
 const p=ordSess();if(!p)return;
 const nx=p.chops.find(c=>!c.done);
 if(nx){curNow={...nx,proj:p.name,pid:p.id,color:p.color,smin:p.sessionMin||30};
  document.getElementById('tmrTask').textContent=curNow.name;}
}
function openOrder(){
 if(!ordSess())return;
 renderOrder();
 document.getElementById('ordOv').classList.add('on');
 document.getElementById('ordSheet').classList.add('on');
}
function closeOrder(){
 document.getElementById('ordOv').classList.remove('on');
 document.getElementById('ordSheet').classList.remove('on');
 syncCur();renderTmrProg();renderAll();
}
// ✓ 는 세션을 끝내지 않는다. 이 찹만 끝내고 다음으로 넘어간다.
function nextChop(){
 if(!curNow)return;
 const pid=curNow.pid;
 comp(curNow.name,curNow.pid);
 const p=items.find(i=>i.id===pid);
 const nx=p&&p.chops?p.chops.find(c=>!c.done):null;
 if(!nx){sessionDone(pid);return;}
 curNow={...nx,proj:p.name,pid:p.id,color:p.color,smin:p.sessionMin||30};
 document.getElementById('tmrTask').textContent=curNow.name;
 renderTmrProg();renderToday();
}
function sessionDone(pid){
 clearInterval(tInt);tmrPid=null;
 chime('done');buzz([60,60,60,60,140]);
 document.getElementById('tmr').classList.remove('on');
 const spent=Math.max(1,Math.round((tTotal-tSec)/60));
 const p=items.find(i=>i.id===pid);
 const cnt=(p&&p.chops)?p.chops.length:0;
 countUp('doneTime',spent,'분');
 document.getElementById('doneMsg').textContent=fmtMin(Math.round(tTotal/60))+' 중에 · 찹 '+cnt+'개';
 document.getElementById('tmrDone').classList.add('on');
 confetti();
}
// 끝냈을 때 숫자가 굴러 올라가면 그 자체로 보상이 된다
function countUp(id,to,suffix){
 const el=document.getElementById(id);if(!el)return;
 el.textContent=to+suffix;   // 프레임이 안 돌아도 값은 맞게 남는다
 const st=Date.now(),dur=760;
 const tick=()=>{const k=Math.min(1,(Date.now()-st)/dur);
  el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+suffix;
  if(k<1)requestAnimationFrame(tick);};
 requestAnimationFrame(tick);
}
function sessionUp(){
 clearInterval(tInt);
 chime('up');buzz([120,90,120]);
 document.getElementById('tmr').classList.remove('on');
 const cs=sessChops();const left=cs.filter(c=>!c.done).length;
 document.getElementById('upMsg').textContent=left
  ?(cs.length-left)+'개 끝냈어요 · '+left+'개 남았어요'
  :'전부 끝냈어요';
 document.getElementById('tmrUp').classList.add('on');
}
function extendTmr(min){
 document.getElementById('tmrUp').classList.remove('on');
 tSec=min*60;tTotal=Math.max(tTotal,min*60);tPaused=false;
 document.getElementById('tmr').classList.add('on');
 updTD();updSeg();renderTmrProg();runTmr();
}
function closeUp(){document.getElementById('tmrUp').classList.remove('on');renderToday();}
// 다른 세션이거나 시간이 다 됐을 때만 처음부터. 같은 세션으로 돌아오면 남은 시간을 이어 받는다.
function startTmr(){if(!curNow)return;tPaused=false;wakeAudio();
 document.getElementById('tmrLbl').textContent='집중 중';
 document.getElementById('pauseBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
 document.getElementById('tmrSrc').textContent=curNow.proj;
 document.getElementById('tmrTask').textContent=curNow.name;
 document.getElementById('tmrFrom').textContent=fmtMin(curNow.smin||30)+' 세션';
 if(tmrPid!==curNow.pid||tSec<=0){tTotal=Math.max(60,(curNow.smin||30)*60);tSec=tTotal;tmrPid=curNow.pid;}
 renderTmrProg();buildSeg();updSeg();updTD();document.getElementById('tmr').classList.add('on');runTmr();}
function runTmr(){clearInterval(tInt);tInt=setInterval(()=>{if(tPaused)return;tSec--;if(tSec<=0){sessionUp();return;}updTD();updSeg();},1000);}
function pauseTmr(){tPaused=!tPaused;document.getElementById('tmrLbl').textContent=tPaused?'일시정지':'집중 중';document.getElementById('pauseBtn').innerHTML=tPaused?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';}
function updTD(){const h=Math.floor(tSec/3600),m=Math.floor(tSec%3600/60),s=tSec%60;
 const el=document.getElementById('tmrDisp');
 el.classList.toggle('hh',h>0);
 el.textContent=(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0');}
// 뒤로 나가도 세션은 그대로다. 그 사실을 알려 준다.
function leaveTmr(){
 const nm=curNow?curNow.proj:'';
 const left=(tSec>0&&tSec<tTotal)?fmtMin(Math.ceil(tSec/60)):'';
 stopTmr();
 toast(left?('멈췄어요 · '+left+' 남음'):'멈췄어요');
}
function stopTmr(){clearInterval(tInt);document.getElementById('ordOv').classList.remove('on');document.getElementById('ordSheet').classList.remove('on');document.getElementById('tmr').classList.remove('on');}
function closeDone(){document.getElementById('tmrDone').classList.remove('on');}
// ===== CREATE =====
function tgC(){const o=document.getElementById('ov'),s=document.getElementById('sht');if(o.classList.contains('on')){clC();}else{o.classList.add('on');s.classList.add('on');const ab=document.getElementById('newFab');if(ab)ab.classList.add('open');
 const cur=liveSess();
 document.getElementById('shSub').textContent=cur?'하던 찹찹은 그대로 남아 있어요':'지금 바로 시작할 일';
 setTimeout(()=>document.getElementById('nTitle').focus(),260);}}
function clC(){document.getElementById('ov').classList.remove('on');document.getElementById('sht').classList.remove('on');
 const ab=document.getElementById('newFab');if(ab)ab.classList.remove('open');}
function createItem(){const ti=document.getElementById('nTitle');const title=ti.value.trim();
 if(!title){ti.placeholder='제목을 적어주세요';ti.style.borderColor='var(--danger-ink)';setTimeout(()=>ti.style.borderColor='',1500);ti.focus();return;}
 // 하던 세션이 기록으로 물러나는 건 시트를 열 때 미리 알린다(tgC).
 // 여기서 confirm을 부르면 안 된다 — 아티팩트 iframe에서는 막혀서 버튼이 죽는다.
 clC();startLoad(title);ti.value='';
}
// ===== SETTINGS =====
function tgRow(label,sub,key){return '<div class="sprow"><div><div class="spl">'+label+'</div>'+(sub?'<div class="sps">'+sub+'</div>':'')+'</div><div class="tg '+(settings[key]?'on':'off')+'" onclick="tgSet(\''+key+'\',this)"></div></div>';}
function tgSet(key,el){settings[key]=!settings[key];el.classList.toggle('on');el.classList.toggle('off');
 if(key==='dark')applyDark();
 if(key==='snd'&&settings[key])chime('up');   // 켜면 바로 들려준다
 save();}
function openSP(type){document.getElementById('spT').textContent=type;const c=document.getElementById('spB');
 if(type==='알림')c.innerHTML=tgRow('타이머 소리','시간이 다 되면 짧게 울려요','snd')
  +tgRow('아침 알림','매일 오전 8:00','nM')+tgRow('저녁 리마인더','매일 오후 9:00','nE')+tgRow('주간 리뷰','매주 월요일','nW');
 else c.innerHTML=tgRow('다크 모드','','dark')+'<div class="sprow" style="display:block;"><div class="spl">AI 분해</div><div class="sps" style="margin:2px 0 10px;">키를 넣으면 AI가 잘라요. 비워두면 기본 목록이 나와요</div><input class="inp" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." value="'+(settings.apiKey||'')+'" oninput="setKey(this.value)" aria-label="Anthropic API 키"><div class="sps" style="margin-top:2px;">키는 이 기기에만 저장돼요. 공용 PC에서는 넣지 마세요</div></div>';
 document.getElementById('spP').classList.add('on');}
function closeSP(){document.getElementById('spP').classList.remove('on');}
// ===== PERSISTENCE =====
function save(){try{localStorage.setItem('chopchop',JSON.stringify({items,cI,ob:1,settings}));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('chopchop'));if(!s)return false;
 items=(s.items||[]).filter(i=>i&&i.type!=='routine');cI=s.cI||0;
 // 기간(start/end)을 쓰던 옛 데이터는 만든 날 하루로 접는다
 items.forEach(i=>{if(!i.day)i.day=i.start||todayKey();delete i.start;delete i.end;delete i.tag;delete i.size;
  // 옛 데이터는 아이콘·색이 비었거나 지금 목록에 없는 값일 수 있다
  if(!i.icon||!ICONS[i.icon])i.icon=pickIcon(i.name);
  if(!i.color||!i.color.bg||!i.color.c)i.color=PAL[Math.abs(String(i.name).length)%PAL.length];});
 if(s.settings)settings=Object.assign(settings,s.settings);
 applyDark();
 return !!s.ob;}catch(e){return false;}}
function addChopManual(){const it=items.find(x=>x.id===editId);if(!it)return;const nm=prompt('찹 이름');if(nm&&nm.trim()){it.chops.push({name:nm.trim(),done:false});renderPD();renderAll();}}
// INIT
const seen=load();
const now=new Date(),dnL=['일','월','화','수','목','금','토'];
(function(){const d=document.getElementById('dateText');
 d.dataset.day=(now.getMonth()+1)+'월 '+now.getDate()+'일 '+dnL[now.getDay()]+'요일';
 d.textContent=d.dataset.day;})();
if(seen){document.getElementById('ob1').classList.remove('on');document.getElementById('p1').classList.add('on');renderAll();}
else{renderLog();renderStats();}
</script>
